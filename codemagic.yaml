workflows:
  moex-android-release:
    name: MOEX Trading Lab — Android Release
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      java: 17
      groups:
        - moex_signing

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ci/codemagic-free-android-build-2026-11-25
          include: true
          source: true

    scripts:
      - name: Validate signing secrets
        script: |
          set -euo pipefail
          for name in MOEX_SIGNING_KEYSTORE_BASE64 MOEX_SIGNING_STORE_PASSWORD MOEX_SIGNING_KEY_ALIAS MOEX_SIGNING_KEY_PASSWORD MOEX_SIGNING_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Codemagic secret: $name"
              exit 1
            fi
          done

      - name: Prepare Android SDK and Gradle 8.13
        script: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:?`ANDROID_SDK_ROOT` is not configured on this Codemagic image}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          if [ ! -x "$HOME/gradle-8.13/bin/gradle" ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$HOME/gradle-8.13-bin.zip"
            unzip -q -o "$HOME/gradle-8.13-bin.zip" -d "$HOME"
          fi
          "$HOME/gradle-8.13/bin/gradle" --version

      - name: Restore permanent signing key
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/.ci-signing"
          printf '%s' "$MOEX_SIGNING_KEYSTORE_BASE64" | base64 -D > "$CM_BUILD_DIR/.ci-signing/moex-trading-lab.jks"
          chmod 600 "$CM_BUILD_DIR/.ci-signing/moex-trading-lab.jks"
          echo "MOEX_SIGNING_KEYSTORE_FILE=$CM_BUILD_DIR/.ci-signing/moex-trading-lab.jks" >> "$CM_ENV"

      - name: Run unit tests and compile instrumentation tests
        script: |
          set -euo pipefail
          "$HOME/gradle-8.13/bin/gradle" testDebugUnitTest compileDebugAndroidTestKotlin

      - name: Assemble signed Debug and Release APKs
        script: |
          set -euo pipefail
          "$HOME/gradle-8.13/bin/gradle" assembleDebug assembleRelease

      - name: Verify APK signatures, certificate, package and version
        script: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          EXPECTED_SHA256="$(printf '%s' "$MOEX_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          verify_apk() {
            APK="$1"
            test -s "$APK"
            "$APKSIGNER" verify --verbose "$APK"
            VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
            printf '%s\n' "$VERIFY_OUTPUT"
            ACTUAL_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | grep -i 'certificate SHA-256 digest' | head -n 1 | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            test -n "$ACTUAL_SHA256"
            test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
            BADGING="$("$AAPT" dump badging "$APK")"
            printf '%s\n' "$BADGING" | grep -F "package: name='ru.moex.tradinglab'"
            printf '%s\n' "$BADGING" | grep -F "versionCode='1'"
            printf '%s\n' "$BADGING" | grep -F "versionName='1.0.0'"
          }

          verify_apk app/build/outputs/apk/debug/app-debug.apk
          verify_apk app/build/outputs/apk/release/app-release.apk

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/apk/release/app-release.apk
