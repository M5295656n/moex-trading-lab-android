name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "integration/**"
  pull_request:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "integration/**"

permissions:
  contents: read

jobs:
  android-build:
    name: Tests and APK builds
    runs-on: ubuntu-latest
    env:
      MOEX_SIGNING_KEYSTORE_BASE64: ${{ secrets.MOEX_SIGNING_KEYSTORE_BASE64 }}
      MOEX_SIGNING_STORE_PASSWORD: ${{ secrets.MOEX_SIGNING_STORE_PASSWORD }}
      MOEX_SIGNING_KEY_ALIAS: ${{ secrets.MOEX_SIGNING_KEY_ALIAS }}
      MOEX_SIGNING_KEY_PASSWORD: ${{ secrets.MOEX_SIGNING_KEY_PASSWORD }}
      MOEX_SIGNING_CERT_SHA256: ${{ secrets.MOEX_SIGNING_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Compile Android instrumentation tests
        run: gradle compileDebugAndroidTestKotlin

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle connectedDebugAndroidTest

      - name: Assemble diagnostic Debug APK
        if: ${{ env.MOEX_SIGNING_KEYSTORE_BASE64 == '' || env.MOEX_SIGNING_STORE_PASSWORD == '' || env.MOEX_SIGNING_KEY_ALIAS == '' || env.MOEX_SIGNING_KEY_PASSWORD == '' || env.MOEX_SIGNING_CERT_SHA256 == '' }}
        run: gradle assembleDebug

      - name: Upload diagnostic Debug APK (not for installation or updates)
        if: ${{ env.MOEX_SIGNING_KEYSTORE_BASE64 == '' || env.MOEX_SIGNING_STORE_PASSWORD == '' || env.MOEX_SIGNING_KEY_ALIAS == '' || env.MOEX_SIGNING_KEY_PASSWORD == '' || env.MOEX_SIGNING_CERT_SHA256 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: moex-trading-lab-debug-diagnostics
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Restore permanent MOEX signing key
        if: ${{ env.MOEX_SIGNING_KEYSTORE_BASE64 != '' && env.MOEX_SIGNING_STORE_PASSWORD != '' && env.MOEX_SIGNING_KEY_ALIAS != '' && env.MOEX_SIGNING_KEY_PASSWORD != '' && env.MOEX_SIGNING_CERT_SHA256 != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/moex-signing"
          echo "$MOEX_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moex-signing/moex-trading-lab.jks"
          chmod 600 "$RUNNER_TEMP/moex-signing/moex-trading-lab.jks"

      - name: Assemble permanently signed Debug and Release APKs
        if: ${{ env.MOEX_SIGNING_KEYSTORE_BASE64 != '' && env.MOEX_SIGNING_STORE_PASSWORD != '' && env.MOEX_SIGNING_KEY_ALIAS != '' && env.MOEX_SIGNING_KEY_PASSWORD != '' && env.MOEX_SIGNING_CERT_SHA256 != '' }}
        env:
          MOEX_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/moex-signing/moex-trading-lab.jks
        run: gradle assembleDebug assembleRelease

      - name: Verify APK signatures, package and version
        if: ${{ env.MOEX_SIGNING_KEYSTORE_BASE64 != '' && env.MOEX_SIGNING_STORE_PASSWORD != '' && env.MOEX_SIGNING_KEY_ALIAS != '' && env.MOEX_SIGNING_KEY_PASSWORD != '' && env.MOEX_SIGNING_CERT_SHA256 != '' }}
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          EXPECTED_SHA256="$(printf '%s' "$MOEX_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          verify_apk() {
            APK="$1"
            test -s "$APK"
            "$APKSIGNER" verify --verbose "$APK"
            VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
            printf '%s\n' "$VERIFY_OUTPUT"
            ACTUAL_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | grep -i 'certificate SHA-256 digest' | head -n 1 | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            test -n "$ACTUAL_SHA256"
            test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
            "$AAPT" dump badging "$APK" | grep -E "package: name='ru.moex.tradinglab'.*versionCode='1'.*versionName='1.0.0'"
          }

          verify_apk app/build/outputs/apk/debug/app-debug.apk
          verify_apk app/build/outputs/apk/release/app-release.apk

      - name: Upload permanently signed Debug APK
        if: ${{ env.MOEX_SIGNING_KEYSTORE_BASE64 != '' && env.MOEX_SIGNING_STORE_PASSWORD != '' && env.MOEX_SIGNING_KEY_ALIAS != '' && env.MOEX_SIGNING_KEY_PASSWORD != '' && env.MOEX_SIGNING_CERT_SHA256 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: moex-trading-lab-debug-v1.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload permanently signed Release APK
        if: ${{ env.MOEX_SIGNING_KEYSTORE_BASE64 != '' && env.MOEX_SIGNING_STORE_PASSWORD != '' && env.MOEX_SIGNING_KEY_ALIAS != '' && env.MOEX_SIGNING_KEY_PASSWORD != '' && env.MOEX_SIGNING_CERT_SHA256 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: moex-trading-lab-release-v1.0.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Explain missing signing configuration
        if: ${{ env.MOEX_SIGNING_KEYSTORE_BASE64 == '' || env.MOEX_SIGNING_STORE_PASSWORD == '' || env.MOEX_SIGNING_KEY_ALIAS == '' || env.MOEX_SIGNING_KEY_PASSWORD == '' || env.MOEX_SIGNING_CERT_SHA256 == '' }}
        run: echo "::warning::Installable APKs skipped. Configure all five MOEX_SIGNING_* repository secrets using docs/MOEX_ANDROID_SIGNING.md."
