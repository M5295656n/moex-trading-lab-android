name: MOEX calendar live validation

on:
  push:
    branches:
      - "feature/moex-calendar-live-validation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Compare legacy ISS calendar URL variants
        shell: bash
        run: |
          set -u
          base="https://iss.moex.com/iss"
          echo "TLS verification is bypassed for this diagnostic probe only; never use this option in the Android client."
          probe() {
            local label="$1"
            local url="$2"
            local body="/tmp/moex-probe-$RANDOM.txt"
            local meta
            meta="$(curl --insecure --silent --show-error --location --max-time 20 \
              -H 'Accept: application/json' \
              -H 'User-Agent: MOEX-Trading-Lab-Android/1.0' \
              -o "$body" -w '%{http_code}|%{content_type}|%{url_effective}' "$url")" || meta="000|transport-error|$url"
            echo "PROBE $label: $meta"
            if jq -e . "$body" >/dev/null 2>&1; then
              echo "JSON keys: $(jq -r 'if type == "array" then (.[1] // {} | keys | join(",")) else keys | join(",") end' "$body" 2>/dev/null)"
            else
              echo "BODY: $(head -c 240 "$body" | tr '\n' ' ')"
            fi
          }

          probe "ISS control engines.json" "$base/engines/stock.json"
          probe "stock calendar no suffix" "$base/calendars/stock?show_all_days=1&iss.only=off_days"
          probe "stock calendar json suffix" "$base/calendars/stock.json?show_all_days=1&iss.only=off_days"
          probe "futures calendar no suffix" "$base/calendars/futures?show_all_days=1&iss.only=off_days"
          probe "futures calendar json suffix" "$base/calendars/futures.json?show_all_days=1&iss.only=off_days"
          probe "stock sessions no suffix" "$base/calendars/stock/session?from=2026-11-20&till=2026-11-30"
          probe "stock sessions json suffix" "$base/calendars/stock/session.json?from=2026-11-20&till=2026-11-30"
          probe "futures sessions no suffix" "$base/calendars/futures/session?from=2026-11-20&till=2026-11-30"
          probe "futures sessions json suffix" "$base/calendars/futures/session.json?from=2026-11-20&till=2026-11-30"

      - name: Check APIM authorization requirement
        shell: bash
        run: |
          set -u
          body="/tmp/apim-calendar.json"
          status="$(curl --insecure --silent --show-error -o "$body" -w '%{http_code}' \
            "https://apim.moex.com/iss/calendars/stock.json?from=2026-11-20&till=2026-11-30")" || status="000"
          echo "APIM without Bearer token: HTTP $status"
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "CONFIRMED: APIM requires authorization without credentials."
          else
            echo "APIM response excerpt: $(head -c 500 "$body" | tr '\n' ' ')"
          fi
